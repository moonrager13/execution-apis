name: Test deployment

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    name: Generate root npm lockfile blob
    if: github.event_name == 'pull_request' && github.head_ref == 'agentkit/base'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v4
        with:
          ref: agentkit/base

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Store generated lockfile as Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json
          with open('package-lock.json', 'rb') as src:
              payload = {
                  'content': base64.b64encode(src.read()).decode('ascii'),
                  'encoding': 'base64',
              }
          with open('/tmp/package-lock-blob.json', 'w') as out:
              json.dump(payload, out)
          PY
          blob_sha="$(gh api --method POST "/repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/package-lock-blob.json --jq '.sha')"
          echo "GENERATED_LOCK_BLOB=${blob_sha}"
