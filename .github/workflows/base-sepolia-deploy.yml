name: Base Sepolia Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cd base-agent && npm install
      - run: cd base-agent && npm run compile
      - run: cd base-agent && npm test
      - name: Deployment readiness
        run: echo "Configure Base RPC and signing secrets before deployment"
