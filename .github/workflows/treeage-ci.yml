name: TreeAge CI

on:
  push:
    branches: [main]
    paths:
      - 'treeage-hardhat/**'
      - '.github/workflows/treeage-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'treeage-hardhat/**'
      - '.github/workflows/treeage-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

timeout-minutes: 15

concurrency:
  group: treeage-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TreeAge / Node 22 / compile + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: treeage-hardhat
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
      - name: Verify Node and npm versions
        run: |
          node --version
          npm --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major < 22 || major >= 25) process.exit(1)"
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Compile contracts
        run: npm run compile
      - name: Run tests
        run: npm test
      - name: Upload Hardhat artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treeage-hardhat-artifacts
          path: |
            treeage-hardhat/artifacts/**
            treeage-hardhat/cache/**
          if-no-files-found: ignore
          retention-days: 7
