name: Deploy Execution API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: execution-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker image
        run: docker images | grep execution-api

      - name: Check Railway token
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "❌ ERROR: RAILWAY_TOKEN secret is not configured"
            exit 1
          fi
          if [ -z "${{ secrets.RAILWAY_SERVICE }}" ]; then
            echo "❌ ERROR: RAILWAY_SERVICE secret is not configured"
            exit 1
          fi
          echo "✅ Railway secrets are configured"

      - name: Deploy to Railway
        run: |
          echo "🚀 Deploying to Railway via API..."
          
          # Verify authentication
          AUTH_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.railway.app/graphql" \
            -d '{"query":"query { me { id } }"}')
          
          if echo "$AUTH_RESPONSE" | grep -q '"id"'; then
            echo "✅ Railway authentication successful"
          else
            echo "❌ Railway authentication failed: $AUTH_RESPONSE"
            exit 1
          fi
          
          # Create deployment
          DEPLOY_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://api.railway.app/graphql" \
            -d '{
              "query": "mutation { serviceInstanceCreate(input: {serviceId: \"'${{ secrets.RAILWAY_SERVICE }}'\", environmentId: \"prod\"}) { id createdAt } }"
            }')
          
          if echo "$DEPLOY_RESPONSE" | grep -q '"id"'; then
            echo "✅ Deployment initiated successfully"
            echo "📊 Response: $DEPLOY_RESPONSE"
          else
            echo "⚠️  Deployment API response: $DEPLOY_RESPONSE"
            echo "💡 Check Railway dashboard for deployment status: https://railway.app"
          fi
        env:
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}

      - name: Deployment Summary
        if: always()
        run: |
          echo "========== Deployment Summary =========="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "========================================"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed!"
          echo ""
          echo "Troubleshooting steps:"
          echo "1. Verify RAILWAY_TOKEN and RAILWAY_SERVICE secrets in repository settings"
          echo "2. Check Railway dashboard: https://railway.app"
          echo "3. Review Railway documentation: https://docs.railway.app"
          echo "4. Check workflow logs for error details"
          exit 1
