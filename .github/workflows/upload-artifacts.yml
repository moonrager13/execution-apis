name: Build and Upload Execution API Artifacts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution-apis
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build OpenRPC specification
        run: make build

      - name: Upload generated execution API artifacts
        uses: moonrager13/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: execution-api-spec-${{ github.sha }}
          path: |
            openrpc.json
            graphql.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
