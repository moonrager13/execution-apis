name: Build and Upload Execution API Artifacts

on:
  push:
    branches:
      - main
      - fix-ci-openzeppelin
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution-apis
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Commit refreshed lockfile
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh npm lockfile"
          git push

      - name: Build OpenRPC specification
        run: make build

      - name: Upload generated execution API artifacts
        uses: moonrager13/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: execution-api-spec-${{ github.sha }}
          path: |
            openrpc.json
            graphql.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
