name: Build and Upload Execution API Artifacts

on:
  push:
    branches:
      - main
      - fix-lockfile-ci
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution-apis
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Build OpenRPC specification
        run: make build

      - name: Verify generated execution API artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s openrpc.json
          test -s graphql.json
          ls -lh openrpc.json graphql.json

      - name: Upload generated execution API artifacts
        uses: moonrager13/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: execution-api-spec-${{ github.sha }}
          path: |
            openrpc.json
            graphql.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
