name: Build and Upload Execution API Artifacts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout execution-apis
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Synchronize lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push

      - name: Install dependencies
        run: npm ci

      - name: Build OpenRPC specification
        run: make build

      - name: Upload generated execution API artifacts
        uses: moonrager13/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: execution-api-spec-${{ github.sha }}
          path: |
            openrpc.json
            graphql.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
