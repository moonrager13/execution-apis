name: TreeAge Hardhat CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'treeage-hardhat/**'
      - '.github/workflows/treeage-ci.yml'
  push:
    branches: [main]
    paths:
      - 'treeage-hardhat/**'
      - '.github/workflows/treeage-ci.yml'

permissions:
  contents: read

concurrency:
  group: treeage-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TreeAge / Node 22 / compile + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: treeage-hardhat
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: treeage-hardhat/package-lock.json

      - name: Verify Node and npm versions
        run: |
          node --version
          npm --version
          node -e "const major=Number(process.versions.node.split('.')[0]); if (major < 22 || major >= 25) process.exit(1)"

      - name: Require lockfile
        run: test -f package-lock.json

      - name: Clean install
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run tests
        run: npm test
